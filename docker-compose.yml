version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    platform: linux/amd64
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ES_TMPDIR=/tmp                # <— use a writable tmp
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data   # data stays on a volume
    tmpfs:
      - /tmp:uid=1000,gid=0,mode=1777          # make /tmp writable to ES user
  backend:
    build: .
    depends_on:
      - elasticsearch
    volumes:
      - .:/app
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_INDEX=rag_docs
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - EMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - PYTHONPATH=/app
      - USE_LLM_EXPLAIN=1
      - MAX_EXPLAIN_PAPERS=2
    ports:
      - "8000:8000"
    command: scripts/entrypoint.sh

volumes:
  esdata: